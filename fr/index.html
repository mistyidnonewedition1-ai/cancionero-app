<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--sf:#151c36;--tx:#eef1ff;--mu:#9aa6cf;--ac:#ff5a6e;--bl:#4f8cff;--gd:#ffd166;--ok:#35e0b0;--bd:#262f55;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.5 'DM Sans',system-ui,sans-serif;background:radial-gradient(800px 420px at 90% -8%,rgba(79,140,255,.4),transparent),radial-gradient(700px 420px at -10% 8%,rgba(255,90,110,.25),transparent),var(--bg);background-attachment:fixed}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(135deg,#2f5bd8,#7c4dff 55%,#ff5a6e);border-radius:20px;padding:14px 16px;box-shadow:0 14px 40px -14px rgba(124,77,255,.7)}
.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));animation:flt 3.5s ease-in-out infinite}
h1,.ttl,.fr{font-family:Fraunces,Georgia,serif;font-weight:800}h1{margin:0;font-size:24px;color:#fff}
.stats{font-size:12px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:rgba(21,28,54,.8);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:5px;margin:10px 0}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--tx);padding:9px 13px;border-radius:13px;font:inherit;font-size:13.5px;cursor:pointer}
nav button.on{background:linear-gradient(135deg,var(--bl),var(--ac));animation:pop .35s}
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent),var(--sf);border:1px solid var(--bd);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 10px 30px -16px #000;animation:up .45s backwards}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:9px;margin:4px 0}
textarea{min-height:90px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--gd);border-color:transparent}
::placeholder{color:#6b77a6}
button.b{border:0;background:linear-gradient(135deg,var(--bl),var(--ac));color:#fff;padding:9px 14px;border-radius:12px;cursor:pointer;font:inherit;font-size:14px;transition:transform .15s}
button.b:hover{transform:translateY(-2px)}button:active{transform:scale(.95)}
button.g{background:transparent;border:1px solid var(--bd)}button.sm{padding:5px 10px;font-size:13px}
.ib{min-width:34px;height:34px;padding:0 8px;display:inline-grid;place-items:center;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);text-decoration:none;font:inherit;font-size:14px;cursor:pointer;margin:2px 4px 2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:13px}
.fr{font-size:20px;line-height:1.6;font-weight:600}
.w{display:inline-block;cursor:pointer;border-radius:4px;transition:transform .15s}.w:hover{background:var(--gd);color:#10162b;transform:translateY(-2px) scale(1.08)}
.ref{margin-top:6px;padding:8px;border-left:3px solid var(--ac);background:rgba(79,140,255,.12);border-radius:6px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--bl));animation:grow .9s backwards}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gd);color:#10162b}
.add{border:2px dashed var(--bl)}.pop{position:sticky;bottom:8px;border:2px solid var(--ac)}
.cl input{display:inline-block;width:auto;min-width:70px;max-width:130px;padding:2px 6px;margin:0 2px;font:18px Fraunces,serif}.cl input.ok{border-color:var(--ok);color:var(--ok)}.cl input.ko{border-color:var(--ac);color:var(--ac)}
.big{font:30px Fraunces,serif;text-align:center;padding:22px 8px;animation:pop .4s}
a{color:#7de3ff}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips a{text-decoration:none;font-size:13px;padding:5px 11px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.sg{display:flex;gap:10px;align-items:center;justify-content:space-between}.sg>div:first-child{display:flex;gap:12px;align-items:center;min-width:0;flex:1;cursor:pointer}
.cov{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:20px;flex:none}.tx{min-width:0}.tx b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{flex-wrap:nowrap;align-items:stretch}#nl{margin:0;min-height:46px;height:46px;resize:none;flex:1}
.qo{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;font-size:15px}.rl{margin:10px 0}
details.card summary{cursor:pointer}details.card[open] summary{margin-bottom:8px}.lg ul{padding-left:18px}
#dock{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:760px;z-index:50;background:var(--sf);border:1px solid var(--bd);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px -10px #000;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
#dock .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}#dock .dh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#dock iframe{width:100%;height:210px;border:0;border-radius:12px;display:block;background:#000}#dock.min iframe{height:1px;opacity:0;pointer-events:none}
body.dk .wrap{padding-bottom:300px}body.dk.mn .wrap{padding-bottom:90px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.85);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes flt{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}@keyframes grow{from{width:0}}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{padding-bottom:84px}
#mas{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none}#mas>*{pointer-events:auto}
#mm{width:58px;height:58px;padding:0;border:0;background:none;cursor:pointer;animation:flt 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#mm .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#mb{max-width:min(250px,62vw);background:#fff;color:#1a1a2e;border-radius:16px 16px 16px 4px;padding:9px 11px;font-size:13.5px;line-height:1.35;box-shadow:0 8px 24px -8px #000;animation:pop .3s}#mb[hidden]{display:none}
#mb .ib{color:#1a1a2e;border-color:#c8cce0;height:28px;min-width:0;font-size:12px;margin:4px 4px 0 0}
body.dk #mas{bottom:calc(235px + env(safe-area-inset-bottom,0px))}body.dk.mn #mas{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
</style>

<body>
<div class="wrap">
<header><div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-label="Logo Chansonnier"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8cff"/><stop offset="1" stop-color="#ff5a6e"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="19" fill="#0b1020" stroke="url(#lg)" stroke-width="2.5"/><path d="M24 44V22l17-4v22" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="45" r="5.5" fill="#fff"/><circle cx="37" cy="41" r="5.5" fill="#fff"/><rect x="12" y="52" width="13" height="3" rx="1.5" fill="#4f8cff"/><rect x="25" y="52" width="13" height="3" rx="1.5" fill="#fff"/><rect x="38" y="52" width="13" height="3" rx="1.5" fill="#ff5a6e"/></svg><h1>Chansonnier</h1></div><div class="row" style="gap:6px;flex-wrap:nowrap"><div class="stats" id="st"></div><a class="stats" href="../#choose" style="text-decoration:none" title="Cambiar de idioma">🌍</a></div></header>
<nav id="nav"></nav>
<main id="v"></main>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
const today=()=>new Date().toISOString().slice(0,10),cap=s=>s.replace(/\b\w/g,c=>c.toUpperCase());
const TABS=[['songs','Canciones'],['tr','Traducir'],['cl','Huecos'],['voc','Palabras'],['rev','Repaso'],['pro','Pronunciación'],['les','Lecciones'],['niv','Nivel']];
const AC=[['fr-FR','Francia'],['fr-CA','Canadá'],['fr-BE','Bélgica'],['fr-CH','Suiza']];
const gen=['YouTube','Spotify','Deezer','Apple Music','SoundCloud','Genius','Musixmatch','Enlace','Texto','Búsqueda'];
let S={songs:[],vocab:[],streak:0,last:'',ex:0,acc:'fr-FR',slow:false,done:{},level:null,skip:false},tab='songs',cur=null,pop=null,card=null,show=false,clz=null,pend=null,DK=null,_n=0;
function ld(){try{const r=localStorage.getItem('chansonnier');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
 if(!S.songs.length)S.songs.push({id:1,title:'Ejemplo original: Après le boulot',artist:'Texto de demostración',link:'',lines:[['Salut mec, t’as vu l’heure ?','Hola tío, ¿has visto la hora?'],['J’suis crevé, j’ai bossé toute la journée.','Estoy hecho polvo, he currado todo el día.'],['Y’a pas de souci, on se voit demain,','No hay problema, nos vemos mañana,'],['et on boit un café sur la place.','y tomamos un café en la plaza.']].map(l=>({f:l[0],e:l[1]})),rate:{},my:{}})}
function sv(){try{localStorage.setItem('chansonnier',JSON.stringify(S))}catch(e){}}
function tick(){const t=today();if(S.last!==t){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=t}S.ex++;sv()}
const song=()=>S.songs.find(s=>s.id==cur)||S.songs[0];
function head(){$('#st').textContent='🔥 '+S.streak+' d · '+S.vocab.length+' palabras'+(S.level?' · '+(S.level.c=='A0'?'Principiante':S.level.c):'');
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
function go(t){tab=t;pop=null;card=null;show=false;draw();scrollTo(0,0)}
function draw(k){head();const y=scrollY;$('#v').innerHTML=VW[tab]();if(k)scrollTo(0,y)}
function picker(){const s=song();return `<select onchange="cur=this.value;clz=null;draw()">${S.songs.map(x=>`<option value="${x.id}" ${x.id==s.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select>`}
const words=t=>t.split(/([\p{L}’'-]+)/u).map((p,i)=>i%2?`<span class="w" onclick="wp(this.textContent)">${esc(p)}</span>`:esc(p)).join('');
function wp(w){w=w.replace(/^[-’']+|[-’']+$/g,'').toLowerCase();const P=w.split(/[’']/);if(P.length>1&&P[0].length<=2&&!/^aujourd/.test(w))w=P.slice(1).join('’');pop={w};draw(true)}
function dict(w){const q=encodeURIComponent(w);return `<a href="https://www.wordreference.com/fres/${q}" target="_blank" rel="noopener">WordReference</a> · <a href="https://www.linguee.es/frances-espanol/search?query=${q}" target="_blank" rel="noopener">Linguee</a> · <a href="https://www.google.com/search?q=${q}+argot+significado" target="_blank" rel="noopener">¿argot?</a>`}
function popup(){return pop?`<div class="card pop"><b class="fr">${esc(pop.w)}</b> ${SB(pop.w,'')}<div class="mu">${dict(pop.w)}</div><input id="pm" placeholder="Significado en español"><div class="row"><select id="pt" style="width:auto"><option value="palabra">Palabra</option><option value="expresión">Expresión</option><option value="argot">Argot / coloquial</option></select><button class="b" onclick="addv()">Añadir</button><button class="b g" onclick="pop=null;draw(true)">Cerrar</button></div></div>`:''}
function addv(){const m=$('#pm').value.trim();if(!m)return;S.vocab.push({id:Date.now(),w:pop.w,tr:m,t:$('#pt').value,src:song().title,box:0,due:today()});pop=null;tick();draw(true)}
/* voz */
function say(t){try{const u=new SpeechSynthesisUtterance(t),L=S.acc||'fr-FR',V=speechSynthesis.getVoices();u.lang=L;u.rate=S.slow?.55:.95;u.voice=V.find(v=>v.lang.replace('_','-')==L)||V.find(v=>v.lang.startsWith('fr'))||null;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const SB=(t,l)=>`<button class="ib" data-t="${esc(t).replace(/'/g,'&#39;')}" onclick="say(this.dataset.t)">🔊${l===''?'':' '+esc(l||t)}</button>`,SX=a=>a.map(x=>SB(x)).join('');
/* canciones */
function vSongs(){return `<div class="card row addr"><textarea id="nl" rows="1" placeholder="＋ Enlace, « Artista - Título » o letra…"></textarea><button class="b" onclick="addl()">Añadir</button></div>`+S.songs.map(s=>{const h=[...s.title].reduce((a,c)=>a+c.charCodeAt(0),0)%360,e=s.link&&emb(s.link);
 return `<div class="card sg"><div onclick="cur=${s.id};go('tr')"><div class="cov" style="background:linear-gradient(135deg,hsl(${h},70%,52%),hsl(${(h+45)%360},80%,60%))">♪</div><div class="tx"><b class="fr">${esc(s.title)}</b><div class="mu">${esc(s.artist)} · ${s.lines.length?s.lines.length+' líneas':s.st=='search'?'🔎 buscando…':'<span class="tag">falta la letra</span>'}</div></div></div><div class="row" style="flex-wrap:nowrap">${!s.lines.length&&s.st!='search'?`<button class="ib" onclick="enrich(${s.id})">🔎</button>`:''}${e?`<button class="ib" onclick="play(${s.id})">▶</button>`:s.link?`<a class="ib" href="${esc(s.link)}" target="_blank" rel="noopener">↗</a>`:''}<button class="ib" onclick="cur=${s.id};song().edit=true;go('tr')">✏️</button><button class="ib" onclick="dels(${s.id})">${pend==s.id?'¿Seguro?':'✕'}</button></div></div>`}).join('')}
function dels(id){if(pend==id){S.songs=S.songs.filter(s=>s.id!=id);pend=null;if(!S.songs.length)ld();sv()}else pend=id;draw()}
function guess(u){let p='Enlace',t='',a='';try{const x=new URL(u),h=x.hostname.replace('www.',''),q=x.pathname.split('/').filter(Boolean),dn=z=>decodeURIComponent(z||'').replace(/-/g,' ');
 if(/youtu/.test(h))p='YouTube';else if(/spotify/.test(h))p='Spotify';else if(/deezer/.test(h))p='Deezer';else if(/apple/.test(h))p='Apple Music';else if(/soundcloud/.test(h)){p='SoundCloud';a=dn(q[0]);t=dn(q[1])}else if(/genius/.test(h)){p='Genius';t=dn(q[0]).replace(/ lyrics$/i,'')}else if(/musixmatch/.test(h)){p='Musixmatch';t=dn(q[q.length-1]);a=dn(q[q.length-2])}}catch(e){}return{p,t,a,u}}
function mk(g,lines){g=g||{p:'Texto',t:'',a:'',u:''};return{id:Date.now()*10+(_n++%10),title:cap(g.t)||('Canción '+g.p),artist:cap(g.a)||g.p,link:g.u,lines:lines.map(f=>({f,e:''})),rate:{},my:{}}}
function addl(){const n=S.songs.length,L=$('#nl').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return;
 if(L.length==1&&!/^https?:/i.test(L[0])&&L[0].length<90){const m=L[0].split(' - '),s=mk({p:'Búsqueda',t:m.length>1?m.slice(1).join(' - '):m[0],a:m.length>1?m[0]:'',u:''},[]);S.songs.push(s);cur=s.id;tick();go('songs');enrich(s.id);return}
 const U=L.filter(x=>/^https?:\/\//i.test(x)),T=L.filter(x=>!/^https?:\/\//i.test(x)),m=U.length?U.map(u=>mk(guess(u),U.length==1?T:[])):[mk(null,T)];
 S.songs.push(...m);cur=m[m.length-1].id;tick();go(m.length==1?'tr':'songs');m.filter(s=>!s.lines.length).forEach(s=>enrich(s.id))}
function strip(t){let o='',d=0;for(const c of t){if('([{'.includes(c))d++;else if(')]}'.includes(c))d=Math.max(0,d-1);else if(!d)o+=c}return o.replace(/ +/g,' ').trim()}
const J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
async function meta(u){let d=null;for(const x of ['https://noembed.com/embed?url=','https://www.youtube.com/oembed?format=json&url=','https://open.spotify.com/oembed?url=']){try{d=await J(x+encodeURIComponent(u));if(d&&d.title)break}catch(e){d=null}}
 if(!d||!d.title)return null;let t=strip(d.title).replace(/ [–—] /g,' - '),a=strip(d.author_name||'').replace(/vevo|- topic/ig,'').trim();const m=t.split(' - ');if(m.length>1){a=m[0].trim();t=m.slice(1).join(' - ').trim()}return{t:cap(t),a:cap(a)}}
async function lyr(a,t){const g=gen.includes(a)?'':a,cl=x=>x.split('\n').map(l=>l.trim()).filter(l=>l&&!(l[0]=='['&&l.endsWith(']'))).slice(0,220);
 try{const R=await J('https://lrclib.net/api/search?q='+encodeURIComponent((g+' '+t).trim())),h=R.find(x=>x.plainLyrics);if(h)return{l:cl(h.plainLyrics),t:h.trackName,a:h.artistName}}catch(e){}
 if(g){try{const r=await J('https://api.lyrics.ovh/v1/'+encodeURIComponent(g)+'/'+encodeURIComponent(t));if(r.lyrics)return{l:cl(r.lyrics),t:t,a:g}}catch(e){}}return null}
async function enrich(id){const s=S.songs.find(x=>x.id==id);if(!s)return;s.st='search';sv();draw(true);
 try{if(s.link&&!s.meta){const m=await meta(s.link);s.meta=1;if(m){if(m.t)s.title=m.t;if(m.a)s.artist=m.a}}
  if(/^Canción /.test(s.title)&&gen.includes(s.artist))throw 0;
  const R=await lyr(s.artist,s.title);
  if(R&&R.l.length){s.lines=R.l.map(f=>({f,e:''}));s.auto=1;s.st='ok';s.rate={};s.my={};if(gen.includes(s.artist)&&R.a)s.artist=R.a;if(/^Canción /.test(s.title)&&R.t)s.title=R.t}else s.st='fail'}catch(e){s.st='fail'}
 sv();draw(true)}
async function mt(x){try{const j=await J('https://api.mymemory.translated.net/get?langpair='+encodeURIComponent('fr|es')+'&q='+encodeURIComponent(x)),t=j&&j.responseData&&j.responseData.translatedText;if(t&&!/MYMEMORY WARNING|INVALID/i.test(t)){const e=document.createElement('textarea');e.innerHTML=t;return e.value}}catch(e){}return null}
async function allmt(b){const s=song();for(let i=0;i<s.lines.length;i++){const l=s.lines[i];if(l.e)continue;b.textContent='🌐 '+(i+1)+' / '+s.lines.length+'…';const t=await mt(l.f);if(!t){sv();b.textContent='🌐 Servicio no disponible o límite alcanzado: inténtalo más tarde';return}l.e=t;l.mt=1;await new Promise(r=>setTimeout(r,250))}sv();b.textContent='✅ Traducciones listas (con « Ver traducción »)'}
function bar(s){const q=encodeURIComponent(s.title+' '+s.artist+' paroles'),e=s.link&&emb(s.link);
 return `<div class="chips">${e?`<a href="#" onclick="play(${s.id});return false">▶ Escuchar aquí</a>`:''}${s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener">↗ Abrir</a>`:''}${!s.lines.length?`<a href="#" onclick="enrich(${s.id});return false">🔎 Buscar la letra</a>`:''}<a href="https://genius.com/search?q=${q}" target="_blank" rel="noopener">📜 Genius</a><a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">🔎 Google</a>${s.lines.length&&s.lines.some(l=>!l.e)?`<a href="#" onclick="allmt(this);return false">🌐 Preparar traducciones</a>`:''}${s.auto&&s.lines.length?`<div class="mu" style="width:100%">Letra encontrada automáticamente: comprueba que corresponde a la canción (✏️ para corregir).</div>`:''}</div>`}

<div class="card"><b>📚 Lecciones recomendadas</b>${RC[L.c].map(id=>`<div class="rl">• ${LES.find(x=>x.id==id).t}</div>`).join('')}<div class="row" style="margin-top:8px"><button class="b" data-g="les" onclick="go(this.dataset.g)">🎓 Abrir lecciones</button><button class="b g" data-g="songs" onclick="go(this.dataset.g)">🎸 Mis canciones</button></div></div>
<details class="card"><summary><b>🔍 Correcciones (${L.wrong.length})</b></summary>${L.wrong.map(w=>`<div class="rl"><div>${w[0]}</div><div class="mu">Tu respuesta: ${esc(w[1])}</div><div style="color:var(--ok)">Respuesta correcta: ${esc(w[2])}</div></div>`).join('')||'<p>Ningún error, ¡bravo!</p>'}</details>`}
function vNiv(){const L=S.level;
 if(QS.i>=QZ.length)return resH(L)+`<div class="row"><button class="b g" onclick="QS.i=-1;draw()">Repetir la prueba</button></div>`;
 if(QS.i<0)return `<div class="card"><b class="ttl">🎯 Prueba de nivel</b><p>20 preguntas para estimar tu nivel de francés, de A1 a C1 (escala MCER). Gramática, vocabulario, lectura y dos preguntas de comprensión oral, como en los tests de nivel y los exámenes DELF. Unos 10 minutos, sin diccionario.</p><div class="row"><button class="b" onclick="qstart()">${L?'Repetir la prueba':'Empezar'}</button>${L?'':`<button class="b g" onclick="qskip()">Saltar por ahora</button>`}</div></div>`+(L?resH(L):'');
 const q=QZ[QS.i];return `<div class="card"><div class="mu">Pregunta ${QS.i+1} / ${QZ.length}</div><div class="bar"><i style="width:${QS.i/QZ.length*100}%"></i></div><p class="fr" style="font-size:19px">${q.q}</p>${q.t?`<div class="row">${SB(q.t,'Escuchar')}<button class="ib" onclick="QS.show=!QS.show;draw(true)">👁 Texto</button></div>${QS.show?`<div class="ref">${esc(q.t)}</div>`:''}`:''}${QS.p[QS.i].map(k=>`<button class="b g qo" onclick="qa(${k})">${esc(q.o[k])}</button>`).join('')}<div class="row"><button class="ib" onclick="qa(-1)">No lo sé</button></div></div>`}
const VW={songs:vSongs,tr:vTr,cl:vCl,voc:vVoc,rev:vRev,pro:vPro,les:vLes,niv:vNiv};
const MASC=`<svg viewBox='0 0 64 64' width='58' height='58' aria-label='Coco le coq'><ellipse cx='13' cy='36' rx='5' ry='12' fill='#ff5a6e' transform='rotate(-25 13 36)'/><ellipse cx='10' cy='39' rx='4' ry='10' fill='#4f8cff' transform='rotate(-35 10 39)'/><ellipse cx='17' cy='42' rx='5' ry='11' fill='#3f74d8' transform='rotate(10 17 42)'/><ellipse cx='47' cy='42' rx='5' ry='11' fill='#3f74d8' transform='rotate(-10 47 42)'/><ellipse cx='32' cy='40' rx='16' ry='17' fill='#fff4e0'/><rect x='24' y='55' width='5' height='5' rx='2' fill='#ffb02e'/><rect x='35' y='55' width='5' height='5' rx='2' fill='#ffb02e'/><circle cx='32' cy='23' r='14' fill='#fff4e0'/><circle cx='26.5' cy='9' r='4' fill='#ff5a6e'/><circle cx='32' cy='7' r='4.5' fill='#ff5a6e'/><circle cx='37.5' cy='9' r='4' fill='#ff5a6e'/><g class='eye'><circle cx='26.5' cy='22' r='4.6' fill='#fff' stroke='#e4d6bd' stroke-width='.8'/><circle cx='37.5' cy='22' r='4.6' fill='#fff' stroke='#e4d6bd' stroke-width='.8'/><circle cx='27' cy='22.5' r='2.2' fill='#10162b'/><circle cx='37' cy='22.5' r='2.2' fill='#10162b'/></g><path d='M28 26h8l-4 8z' fill='#ffc857'/><ellipse cx='32' cy='37' rx='3' ry='4' fill='#ff5a6e'/><path d='M16 23a16 16 0 0 1 32 0' fill='none' stroke='#1b1f3a' stroke-width='3'/><rect x='12.5' y='20' width='6' height='11' rx='3' fill='#4f8cff'/><rect x='45.5' y='20' width='6' height='11' rx='3' fill='#4f8cff'/></svg>`;
const MS=[['¡Hola! Soy Coco. Toca una palabra de la letra para guardarla.','Bonjour !','¡Buenos días!'],['Consejo: escucha la canción una vez sin leer y luego traduce verso a verso.'],['Dato curioso: en francés la «h» casi siempre es muda.','heure','hora'],['La «r» francesa se entrena: prueba «rue» en la pestaña Pronunciación.','rue','calle'],['Un poco cada día es la clave. 🎶'],['Tus palabras te esperan en Repaso.','On révise ?','¿Repasamos?'],['Puedes cambiar el acento (Francia, Canadá…) en Pronunciación.','Ça va ?','¿Qué tal?'],['¿Cantamos?','Allons chanter !','¡Vamos a cantar!']];
const PR=['Bravo ! 🎉','¡Muy bien!','Super !','Magnifique !','¡Bravo! 👏'];
let mi=0,mto;
function mas(m){const b=document.getElementById('mb');let h;if(typeof m=='string')h=esc(m);else{const x=MS[mi++%MS.length];h=esc(x[0])+(x[1]?`<div>${SB(x[1])} <span style='opacity:.7'>${esc(x[2]||'')}</span></div>`:'')}b.innerHTML=h;b.hidden=false;clearTimeout(mto);mto=setTimeout(()=>{b.hidden=true},8000)}
(function(){const d=document.createElement('div');d.id='mas';d.innerHTML=`<button id='mm' aria-label='Mascota' onclick='mas()'>${MASC}</button><div id='mb' hidden></div>`;document.body.append(d);setTimeout(()=>mas(MS[0][0]),1800)})();
const _bm=boom;boom=function(n){_bm(n);mas(PR[Math.floor(Math.random()*PR.length)])};
try{localStorage.setItem('lang','fr')}catch(e){}
ld();if(!S.level&&!S.skip)tab='niv';draw();
</script>
